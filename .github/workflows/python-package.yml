# This workflow installs Python dependencies, runs tests and lint across
# supported Python versions, and smoke-tests the standalone binary build.

name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "./src[dev]"
      - name: Lint with ruff
        run: |
          ruff check src
          ruff format --check src
      - name: Test with pytest
        run: |
          pytest src/tests

  binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller "./src[dev]"
      - name: Bundle the standalone cru binary
        run: |
          python -m PyInstaller --onefile --name cru \
            --collect-all cruine \
            --collect-all pydantic \
            --collect-all py7zr \
            --collect-all pycdlib \
            --distpath target \
            --workpath target/cru-build \
            --specpath target \
            scripts/cru.py
      - name: Smoke-test the binary
        run: |
          ./target/cru version
          ./target/cru --list-formats
          ./target/cru help build

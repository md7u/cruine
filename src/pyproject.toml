[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cruine"
version = "0.1.0"
description = "Cruine: Android Custom ROM build automation engine."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Myden (@md7u)" }]
keywords = ["android", "aosp", "rom", "build", "automation", "lineageos"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "pydantic>=2.0,<3.0",
    "py7zr>=0.20,<1.0",
    "pycdlib>=1.12,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.6,<1.0",
]

[project.scripts]
cru = "cruine.cli:main"

[tool.setuptools]
packages = [
    "cruine",
    "cruine.commands",
    "cruine.config",
    "cruine.core",
    "cruine.models",
    "cruine.utils",
]

[tool.setuptools.package-dir]
cruine = "."

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "W", "F", "UP", "B", "SIM", "I", "RUF", "PLW", "TRY", "C4"]
ignore = ["TRY003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
